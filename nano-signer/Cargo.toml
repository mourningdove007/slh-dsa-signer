[package]
edition      = "2024"
name         = "nano-signer"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "nano-signer"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "unstable"] }


esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }

critical-section = "1.2.0"
# Forked locally from slh-dsa 0.2.0-rc.5 to add a hardware-SHA HashSuite
# backend for the ESP32-S3; see NANO_DOCUMENTATION.md. Package name is kept
# as "slh-dsa" so no other source in this crate needs to change.
slh-dsa = { path = "../slh-dsa-hw", default-features = false, features = ["hw-sha"] }
# Software side of the '1'/'2'/'3' hashing benchmark commands. Pinned to the
# same versions the forked slh-dsa crate depends on, so both unify to one
# copy instead of building two separate ones (see NANO_DOCUMENTATION.md
# "Issues encountered" for what happens when this isn't done).
sha2 = { version = "0.11", default-features = false }
hmac = "0.13"


[features]
default = ["param-192f"]
param-128s = []
param-128f = []
param-192s = []
param-192f = []
param-256s = []
param-256f = []

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
