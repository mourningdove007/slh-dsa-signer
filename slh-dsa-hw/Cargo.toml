# Local fork of RustCrypto's `slh-dsa`; see README.md.

[package]
edition = "2024"
rust-version = "1.85"
name = "slh-dsa"
version = "0.2.0-rc.5"
build = false
exclude = ["tests"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Pure Rust implementation of SLH-DSA (aka SPHINCS+) as described in the
FIPS-205 standard
"""
homepage = "https://github.com/RustCrypto/signatures/tree/master/slh-dsa"
readme = "README.md"
keywords = [
    "crypto",
    "signature",
]
categories = ["cryptography"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/RustCrypto/signatures"
resolver = "2"

[features]
alloc = []
default = [
    "alloc",
    "pkcs8/alloc",
]
zeroize = [
    "dep:zeroize",
    "hybrid-array/zeroize",
]
# ESP32-S3 hardware SHA backend for Sha2L1/Sha2L35; see README.md.
hw-sha = ["dep:esp-hal", "dep:critical-section", "dep:nb"]

[lib]
name = "slh_dsa"
path = "src/lib.rs"
bench = false

[[bench]]
name = "sign_verify"
path = "benches/sign_verify.rs"
harness = false

[dependencies.const-oid]
version = "0.10"
features = ["db"]

[dependencies.digest]
version = "0.11"

[dependencies.hmac]
version = "0.13"

[dependencies.hybrid-array]
version = "0.4"
features = ["extra-sizes"]

[dependencies.pkcs8]
version = "0.11"
default-features = false

[dependencies.rand_core]
version = "0.10"

[dependencies.sha2]
version = "0.11"
default-features = false

[dependencies.sha3]
version = "0.11"
default-features = false

[dependencies.signature]
version = "3.0.0-rc.10"
features = ["rand_core"]

[dependencies.typenum]
version = "1.20"
features = ["const-generics"]

[dependencies.zerocopy]
version = "0.8"
features = ["derive"]

[dependencies.zeroize]
version = "1.8.1"
optional = true
default-features = false

[dependencies.esp-hal]
version = "~1.1.0"
features = ["esp32s3", "unstable"]
optional = true

[dependencies.critical-section]
version = "1.2.0"
optional = true

[dependencies.nb]
version = "1"
optional = true

[dev-dependencies.aes]
version = "0.9.0-rc.2"

[dev-dependencies.cipher]
version = "0.5"

[dev-dependencies.criterion]
version = "0.7"

[dev-dependencies.ctr]
version = "0.10.0-rc.3"

[dev-dependencies.hex]
version = "0.4.1"
features = ["serde"]

[dev-dependencies.hex-literal]
version = "1"

[dev-dependencies.num-bigint]
version = "0.4.4"

[dev-dependencies.paste]
version = "1.0.15"

[dev-dependencies.pkcs8]
version = "0.11"
features = ["pem"]

[dev-dependencies.proptest]
version = "1.11.0"

[dev-dependencies.rand]
version = "0.10"

[dev-dependencies.serde]
version = "1.0.207"
features = ["derive"]

[dev-dependencies.serde_json]
version = "1.0.124"
